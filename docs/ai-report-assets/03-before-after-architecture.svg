<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#111827"/></linearGradient>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#94a3b8"/></marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="80" y="90" fill="#f8fafc" font-size="46" font-family="Arial, 'PingFang SC', sans-serif" font-weight="700">优化前后架构对比</text>
  <text x="82" y="136" fill="#94a3b8" font-size="24" font-family="Arial, 'PingFang SC', sans-serif">从 per-cell ArkUI 组件刷新，升级为视口级 Canvas 绘制</text>

  <g font-family="Arial, 'PingFang SC', sans-serif">
    <rect x="80" y="190" width="680" height="610" rx="20" fill="#1f1720" stroke="#7f1d1d" stroke-width="2"/>
    <text x="120" y="250" fill="#fecaca" font-size="34" font-weight="700">优化前：ArkUI 多组件表格</text>
    <g fill="#2b1820" stroke="#ef4444" stroke-width="2">
      <rect x="135" y="320" width="235" height="82" rx="12"/>
      <rect x="135" y="442" width="235" height="82" rx="12"/>
      <rect x="135" y="564" width="235" height="82" rx="12"/>
      <rect x="435" y="320" width="235" height="82" rx="12"/>
      <rect x="435" y="442" width="235" height="82" rx="12"/>
      <rect x="435" y="564" width="235" height="82" rx="12"/>
    </g>
    <g fill="#fee2e2" font-size="22" font-weight="700" text-anchor="middle">
      <text x="252" y="370">行情数据</text>
      <text x="252" y="492">逐 cell 写入</text>
      <text x="252" y="614">响应式传播</text>
      <text x="552" y="370">大量组件刷新</text>
      <text x="552" y="492">滚动竞争 UI 线程</text>
      <text x="552" y="614">P95 长帧风险</text>
    </g>
    <g stroke="#fca5a5" stroke-width="3" fill="none" marker-end="url(#arrow)">
      <path d="M252 402 L252 442"/>
      <path d="M252 524 L252 564"/>
      <path d="M370 361 L435 361"/>
      <path d="M552 402 L552 442"/>
      <path d="M552 524 L552 564"/>
    </g>

    <rect x="840" y="190" width="680" height="610" rx="20" fill="#0f251e" stroke="#059669" stroke-width="2"/>
    <text x="880" y="250" fill="#bbf7d0" font-size="34" font-weight="700">优化后：视口级 Canvas</text>
    <g fill="#102d26" stroke="#34d399" stroke-width="2">
      <rect x="895" y="320" width="250" height="82" rx="12"/>
      <rect x="895" y="442" width="250" height="82" rx="12"/>
      <rect x="895" y="564" width="250" height="82" rx="12"/>
      <rect x="1205" y="320" width="250" height="82" rx="12"/>
      <rect x="1205" y="442" width="250" height="82" rx="12"/>
      <rect x="1205" y="564" width="250" height="82" rx="12"/>
    </g>
    <g fill="#dcfce7" font-size="22" font-weight="700" text-anchor="middle">
      <text x="1020" y="370">批量 Delta 写入</text>
      <text x="1020" y="492">普通 DataView</text>
      <text x="1020" y="614">dataRevision 显式触发</text>
      <text x="1330" y="370">只读可见区域</text>
      <text x="1330" y="492">Canvas 单链路绘制</text>
      <text x="1330" y="614">刷新成本可控</text>
    </g>
    <g stroke="#86efac" stroke-width="3" fill="none" marker-end="url(#arrow)">
      <path d="M1020 402 L1020 442"/>
      <path d="M1020 524 L1020 564"/>
      <path d="M1145 361 L1205 361"/>
      <path d="M1330 402 L1330 442"/>
      <path d="M1330 524 L1330 564"/>
    </g>
  </g>
  <rect x="390" y="820" width="820" height="48" rx="24" fill="#0b1220" stroke="#334155"/>
  <text x="800" y="852" text-anchor="middle" fill="#e5e7eb" font-size="23" font-family="Arial, 'PingFang SC', sans-serif">核心变化：减少组件数量、减少响应式传播、只绘制用户看得到的区域</text>
</svg>
